<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page">
        <div class="leftcontainer">
            <img src="./aston.jpg" alt="aston martin">
            <div class="overlay">
                <div>Jello Penis</div>
            </div>
        </div>
        <div class="rightcontainer">
            <h1 class="description">You need this service you need it so bad</h1>
            <form>
                <h1 class="lube">Lube up</h1>
                <div class="card">
                    <div class="firstname">
                        <label for="firstname">First name</label>
                        <input type="text" id="firstname" placeholder="crabcake" required>
                    </div>
                    <div class="lastname">
                        <label for="lastname">Last name</label>
                        <input type="text" id="lastname" placeholder="crabcake" required>
                    </div>
                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="johnpenisbisquit@gmail.com" required>
                    </div>
                    <div class="phone">
                        <label for="tel">Phone</label>
                        <input type="tel" id="tel" placeholder="123-606-1234" required>
                    </div>
                    <div class="pword">
                        <label for="pass">Password</label>
                        <input type="password" id="pass" required>
                    </div>
                    <div class="confirm">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" required>
                    </div>
                </div>
                <div class="footer">
                    <button class="button" type="submit">Create Account</button>
                    <div class="login">Already have an account? <a href="index.html">Log in</a></div>
                </div>
                
            </form>
           
        </div>
    </div>
    
</body>
</html>
