<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page">
        <div class="leftcontainer">
            <img src="./aston.jpg" alt="aston martin">
            <div class="overlay">
                <div>Jello Party</div>
            </div>
            <div class="imagefooter">
                <div>Photo by <a class="plug" href="https://unsplash.com/@thibautnagorny?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Thibaut Nagorny</a> on <a class="plug" href="https://unsplash.com/photos/brown-vehicle-nKAglN6HBH8?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></div>
            </div>
            
            
            
        </div>
        <div class="rightcontainer">
            <h1 class="description">You need this service you need it so bad</h1>
            <form>
                <h1 class="lube">Join today!</h1>
                <div class="card">
                    <div class="firstname">
                        <label for="firstname">First name</label>
                        <input type="text" id="firstname" placeholder="John" required>
                    </div>
                    <div class="lastname">
                        <label for="lastname">Last name</label>
                        <input type="text" id="lastname" placeholder="Crabcake" required>
                    </div>
                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="johncrabcake@gmail.com" required>
                    </div>
                    <div class="phone">
                        <label for="tel">Phone</label>
                        <input type="tel" id="tel" placeholder="123-666-9420" required>
                    </div>
                    <div class="pword">
                        <label for="pass">Password</label>
                        <input type="password" id="pass" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                        title="Must contain at least one number, one uppercase, one lowercase letter, and at least 8 characters"  required>
                    </div>
                    <div class="confirm">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Must contain at least one number, one uppercase, one lowercase letter, and at least 8 characters" required>
                    </div>
                </div>
                <div class="footer">
                    <button class="button" type="submit">Create Account</button>
                    <div class="login">Already have an account? <a href="index.html">Log in</a></div>
                </div>
                
            </form>
           
        </div>
    </div>
    
</body>
</html>
